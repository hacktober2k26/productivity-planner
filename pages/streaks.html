<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Streaks</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="streaks.css">
    <link rel="stylesheet" href="pages/components/sidebar.css">

</head>

<body>

<div class="streak-page">

    <div class="streak-card">

        <h1>🔥 Your Streaks</h1>

        <p>Stay consistent. Small wins every day.</p>

        <div class="stats">

            <div class="stat-box">

                <h2 id="currentStreak">0</h2>

                <span>Current Streak</span>

            </div>

            <div class="stat-box">

                <h2 id="bestStreak">0</h2>

                <span>Best Streak</span>

            </div>

        </div>

        <button id="completeDay">
            ✅ Mark Today Complete
        </button>

        <a href="../index.html" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</div>

<script src="streaks.js"></script>
<script src="components/sidebar.js"></script>


</body>
</html>
